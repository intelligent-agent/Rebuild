name: Packages
# Rebuild's own packages (rebuild-recore, rebuild-printer), published to the
# apt repository on feeds.iagent.no whenever they change, and for every tag.
# GitHub does not apply path filters to tags.
# A manual run builds the packages of any branch into trixie-test, where
# Recore-CI's upgrade test installs them on a cell before they are merged.
# Recore-CI passes the label as the run's title, to find the run it started.
run-name: ${{ inputs.label }}
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'packaging/**'
      - '.github/workflows/packages.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to publish to'
        type: choice
        default: trixie-test
        options:
          - trixie-test
          - trixie-dev
      label:
        description: 'Title for this run (blank = the default)'
        type: string
        required: false
        default: ''

jobs:
  # Built and published without an image: a fix in packaging/ reaches boards
  # on development images as a System update in about a minute. To trixie-dev,
  # tags too - a release reaches
  # trixie, the suite released images use, only when a person promotes it on
  # feeds (rebuild-apt-promote): CI cannot publish there, so a compromised
  # runner cannot reach users' boards. rebuild-publish lives on the runner,
  # outside this public repository, with a key that can only run the publish
  # script on feeds. Without it the job warns and stops (#108).
  packages:
    runs-on: [self-hosted, rebuild]
    env:
      SUITE: ${{ inputs.suite }}    # empty on a push: trixie-dev
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0    # build-debs versions from `git describe --tags`

    - name: Test packages
      # bats in the same throwaway container build-debs uses: the runner has
      # docker but not bats. git for the klipper-extras tests.
      run: |
        docker run --rm -v "$PWD:/w" -w /w debian:trixie sh -c \
          'apt-get update -qq && apt-get install -y -qq --no-install-recommends bats git >/dev/null && bats packaging/tests'

    - name: Build packages
      run: packaging/build-debs "$RUNNER_TEMP/debs"

    - name: Publish packages
      run: |
        if [ ! -x "$HOME/bin/rebuild-publish" ]; then
          echo "::warning::no rebuild-publish on this runner - packages not published"
          exit 0
        fi
        "$HOME/bin/rebuild-publish" "${SUITE:-trixie-dev}" "$RUNNER_TEMP/debs"
        rm -rf "$RUNNER_TEMP/debs"

