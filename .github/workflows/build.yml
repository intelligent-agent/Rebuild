name: Build Armbian
# The title of the run, as it appears in the Actions list and in the Discord
# webhook. Recore-CI passes the name of the image the build will produce -
# rebuild-fluidd-v1.1.0-RC6-17-gaefe069 - which it gets by asking the runner to
# describe the commit, the same `git describe --always --tags` that names the
# .img.xz. Blank falls back to GitHub's default ("If run-name is omitted or is
# only whitespace, then the run name is set to event-specific information"),
# which is the commit message on a push, and worth keeping.
#
# The version cannot be resolved here instead: run-name is evaluated when the
# run is created, before any checkout exists to describe. Nor can a job `name:`
# carry it - that works for a job that runs, but a SKIPPED job keeps the
# literal "${{ ... }}" template, and a push to main skips three of the four.
run-name: ${{ inputs.label }}
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Build any variant on demand, from any branch, without cutting a tag.
  # Previously the only ways to get a fluidd/mainsail/octoprint image were to
  # tag a release or to ssh into the runner and drive rebuild.sh by hand - and
  # the hand-driven route has to be sequenced against whatever CI is already
  # doing, because both use the same build directories.
  workflow_dispatch:
    inputs:
      variant:
        description: 'Image to build'
        type: choice
        default: barebone
        options:
          - barebone
          - fluidd
          - mainsail
          - octoprint
          - all
      label:
        description: 'Title for this run (blank = the default)'
        type: string
        required: false
        default: ''
env:
  TERM: xterm-256color
  # Coron​​as places the actual Docker build containers in this shared slice.
  # It has no CPU quota, so an idle second runner costs nothing; MemoryHigh
  # keeps two simultaneous image builds from pushing the host into OOM.
  REBUILD_CGROUP_PARENT: rebuild-build.slice

jobs:
  build-barebone:
    # Unchanged for push and tag; on a manual run, only when asked for.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.variant == 'barebone' ||
      github.event.inputs.variant == 'all'
    runs-on: [self-hosted, rebuild]
    steps:
    # fetch-depth: 0 for the tags. rebuild.sh names the image from
    # `git describe --always --tags`, and checkout defaults to a shallow clone
    # with no tags fetched - so --tags matched nothing here and the --always
    # fallback emitted a bare commit hash. That is why images arrive as
    # "rebuild-fluidd-343e3e8" rather than carrying the release they came from,
    # and why the CI and the board can only report a hash. Same fix as Reflash.
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Remove old images
      run: rm -f ../images/rebuild-barebone-*.img.xz

    - name: Run build
      run: ./rebuild.sh barebone

    - name: Stage image for Recore CI
      run: |
        mkdir -p /home/elias/rebuild-images
        for image in ../images/rebuild-barebone-*.img.xz; do
          test -e "$image" || continue
          target=/home/elias/rebuild-images/$(basename "$image")
          tmp="${target}.${GITHUB_RUN_ID}.${GITHUB_JOB}.tmp"
          cp "$image" "$tmp"
          mv "$tmp" "$target"
        done

    - name: Release if tagged
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        allowUpdates: true
        artifacts: ../images/rebuild-barebone-v*.img.xz
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true

  build-mainsail:
    # Tags and manual runs only. A push to main builds barebone alone as a
    # smoke test - it exercises the same u-boot, kernel and boot script at a
    # quarter the size, and these three are only ever published from a tag.
    # workflow_dispatch is the escape hatch for building one on demand without
    # cutting a release.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.variant == 'mainsail' ||
        github.event.inputs.variant == 'all'))
    runs-on: [self-hosted, rebuild]
    steps:
    # fetch-depth: 0 for the tags. rebuild.sh names the image from
    # `git describe --always --tags`, and checkout defaults to a shallow clone
    # with no tags fetched - so --tags matched nothing here and the --always
    # fallback emitted a bare commit hash. That is why images arrive as
    # "rebuild-fluidd-343e3e8" rather than carrying the release they came from,
    # and why the CI and the board can only report a hash. Same fix as Reflash.
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Remove old images
      run: rm -f ../images/rebuild-mainsail-*.img.xz

    - name: Run build
      run: ./rebuild.sh mainsail

    - name: Stage image for Recore CI
      run: |
        mkdir -p /home/elias/rebuild-images
        for image in ../images/rebuild-mainsail-*.img.xz; do
          test -e "$image" || continue
          target=/home/elias/rebuild-images/$(basename "$image")
          tmp="${target}.${GITHUB_RUN_ID}.${GITHUB_JOB}.tmp"
          cp "$image" "$tmp"
          mv "$tmp" "$target"
        done

    - name: Release if tagged
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        allowUpdates: true
        artifacts: ../images/rebuild-mainsail-v*.img.xz
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true

  build-octoprint:
    # Tags and manual runs only. A push to main builds barebone alone as a
    # smoke test - it exercises the same u-boot, kernel and boot script at a
    # quarter the size, and these three are only ever published from a tag.
    # workflow_dispatch is the escape hatch for building one on demand without
    # cutting a release.
