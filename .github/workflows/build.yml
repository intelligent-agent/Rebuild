name: Build Armbian
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
env:
  TERM: xterm-256color

jobs:
  build-barebone:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v3

    - name: Remove old images
      run: rm -f ../images/rebuild-barebone-*.img.xz

    - name: Run build
      run: ./rebuild.sh barebone

    - name: Release if tagged
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        allowUpdates: true
        artifacts: ../images/rebuild-barebone-v*.img.xz
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true

  build-mainsail:
    # Only on tags. A push to main builds barebone alone as a smoke
    # test - it exercises the same u-boot, kernel and boot script at a
    # quarter the size, and these three are only ever published from a
    # tag anyway.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v3

    - name: Remove old images
      run: rm -f ../images/rebuild-mainsail-*.img.xz

    - name: Run build
      run: ./rebuild.sh mainsail

    - name: Release if tagged
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        allowUpdates: true
        artifacts: ../images/rebuild-mainsail-v*.img.xz
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true

  build-octoprint:
    # Only on tags. A push to main builds barebone alone as a smoke
    # test - it exercises the same u-boot, kernel and boot script at a
    # quarter the size, and these three are only ever published from a
    # tag anyway.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v3
    - name: Remove old images
      run: rm -f ../images/rebuild-octoprint-*.img.xz

    - name: Run build
      run: ./rebuild.sh octoprint
    - name: Release if tagged
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        allowUpdates: true
        artifacts: ../images/rebuild-octoprint-v*.img.xz
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true

  build-fluidd:
    # Only on tags. A push to main builds barebone alone as a smoke
    # test - it exercises the same u-boot, kernel and boot script at a
    # quarter the size, and these three are only ever published from a
    # tag anyway.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v3

    - name: Remove old images
      run: rm -f ../images/rebuild-fluidd-*.img.xz

    - name: Run build
      run: ./rebuild.sh fluidd

    - name: Release if tagged
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        allowUpdates: true
        artifacts: ../images/rebuild-fluidd-v*.img.xz
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true
