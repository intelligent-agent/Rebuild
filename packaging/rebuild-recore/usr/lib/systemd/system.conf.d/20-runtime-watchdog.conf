# Reset the board if systemd stops petting the hardware watchdog for 15 s
# (#107): a hard hang that neither a panic nor the lockup detector catches.
#
# sunxi-wdt allows at most 16 s (see 10-watchdog.conf in rebuild-printer for
# what happens above that). It could reset a printer that stalls for 15 s
# mid-print, but a board whose PID 1 cannot run for 15 s has lost the print
# already: Klipper's MCUs shut down on timing long before that.
[Manager]
RuntimeWatchdogSec=15s
