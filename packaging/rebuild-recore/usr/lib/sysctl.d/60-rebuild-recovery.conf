# Recover from a kernel crash instead of hanging until someone cycles the
# power (#107, #104).

# Reboot 10 s after a panic; the default 0 halts the board for good. That
# includes the hung-task panic the kernel is built with: a task stuck in I/O
# for 120 s, such as an eMMC timing out (-110), used to leave a printer
# permanently hung.
kernel.panic = 10

# A CPU stuck in the kernel (soft lockup) or with interrupts off (hard lockup)
# panics, and so reboots. Only on kernels built with the lockup detector;
# '-' keeps older kernels from logging an error about the missing key.
-kernel.softlockup_panic = 1
-kernel.hardlockup_panic = 1

# Magic SysRq: sync (16), remount read-only (32) and reboot (128) only.
# systemd's default 438 also allows power-off, killing every process and
# changing the log level - and on a Recore a BREAK on the debug header followed
# by a letter is enough to trigger them.
kernel.sysrq = 176
