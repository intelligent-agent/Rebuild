# Don't let Moonraker hold up a reboot for 90 s (#105).
#
# SIGTERM that arrives while Moonraker is still starting up - a reboot soon
# after boot - is logged ("Exiting with signal SIGTERM") but the shutdown
# never completes: component init carries on, fails on the closed database,
# and "Server Shutdown" is never reached. systemd then waits out its default
# 90 s stop timeout before killing it. Measured on an A8 on v1.1.0: 8 of 19
# warm reboots took ~129 s instead of ~39 s, every one of them this.
#
# A normal Moonraker shutdown takes well under a second, so 10 s only ever
# cuts short the hang. The unit itself is Moonraker's own, written by its
# installer and rewritten by its updates, hence a drop-in.
[Service]
TimeoutStopSec=10s
