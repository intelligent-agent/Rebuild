# Keeps rebuild-firmware.service loaded, so Moonraker offers it in the
# services menu of Fluidd and Mainsail (#106). Moonraker lists services with
# `systemctl list-units --all`, which shows only loaded units, and a oneshot
# that is not enabled is unloaded when idle. An ordering reference from a
# loaded unit keeps it loaded without ever starting it; enabling it would
# build at every boot.
[Unit]
Before=rebuild-firmware.service
