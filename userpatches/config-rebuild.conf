# Read build script documentation https://docs.armbian.com/Developer-Guide_Build-Options/
# for detailed explanation of these options and for additional options not listed here

KERNEL_CONFIGURE="no"

# CLEAN_LEVEL - comma-separated list of clean targets:
#     "make" = make clean for selected kernel and u-boot,
#     "debs" = delete packages in "./output/debs" for current branch and family,
#     "alldebs" = delete all packages in "./output/debs",
#     "images" = delete "./output/images",
#     "cache" = delete "./output/cache", "sources" = delete "./sources"
#     "oldcache" = remove old cached rootfs except for the newest 8 files
CLEAN_LEVEL="oldcache"

DEST_LANG="en_US.UTF-8"
BOOTSIZE=256 
EXPERT=yes
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
COMPRESS_OUTPUTIMAGE=sha,gpg,xz
BOARD=recore
BRANCH=current
RELEASE=trixie
ARTIFACT_IGNORE_CACHE=no
# Preserve hash-versioned packages when Armbian reversions them for an image.
# Otherwise a new Rebuild release version can force an unchanged kernel rebuild.
KEEP_HASHED_DEB_ARTIFACTS=yes
BOOT_FS_LABEL="Recore_boot"
ROOT_FS_LABEL="Recore_root"
# Not frozen with apt-mark hold: pinned by rebuild-armbian-tested instead (#114),
# which a release can move. See install_components/armbian_pins.sh.
BSPFREEZE=no
NETWORKING_STACK="network-manager"
INCLUDE_HOME_DIR="yes"
WIREGUARD=no
enable_extension "rebuild-recore"
