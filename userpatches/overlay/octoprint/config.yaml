accessControl:
  # The touchscreen talks to OctoPrint over the loopback, and this is how it
  # authenticates: OctoPrint logs a local client in as `toggle`, so Toggle sends
  # no password and holds no API key.
  #
  # That is not just tidier, it removes a whole class of bug. toggle-runfirst
  # used to write its user's password as sha512(password + salt); OctoPrint 1.11
  # stores argon2id. The user existed, in the right group, with a hash that could
  # never authenticate - so the screen sat at "waiting" forever on a board whose
  # wizard had been completed. Nothing verifies a hash now.
  #
  # ::1/128 is load-bearing: Toggle connects over the IPv6 loopback, so a v4-only
  # list matches nothing and autologin silently never happens.
  autologinLocal: true
  autologinAs: toggle
  localNetworks:
  - 127.0.0.0/8
  - ::1/128
  - 192.168.0.0/16
appearance:
  name: Recore
folder:
  uploads: /home/printer/printer_data/gcodes
plugins:
  softwareupdate:
    _config_version: 9
    checks:
      octoprint:
        checkout_folder: /home/printer/OctoPrint
        prerelease: false
  klipper:
    _config_version: 4
    connection: {}
    configuration:
      config_path: ~/printer_data/config
      logpath: /var/log/klipper_logs/klippy.log
  toptemp:
    tool0:
      show: false
    bed:
      show: false
    customMon:
      cu2:
        cmd: (?:B):.*? Board:([^ ]+)
        colorIcons: false
        decSep: .
        graphSettings:
          color: '#000000'
          height: 50
          opa: 0.2
          show: false
          width: 1
        hideOnNoTarget: false
        icon: fas fa-thermometer-full
        interval: 25
        isTemp: true
        label: 'Input:'
        name: Board
        noDigits: '1'
        postCalc: null
        show: true
        showPopover: true
        showUnit: true
        type: gcIn
        unit: ''
        updated: 1628968382280
        waitForPrint: false
        width: 0
      cu3:
        cmd: (?:B):.*? Voltage:([^ ]+)
        colorChangeLevel: 60
        colorIcons: false
        decSep: .
        graphSettings:
          color: '#000000'
          height: 50
          opa: 0.2
          show: false
          width: 1
        hideOnNoTarget: false
        icon: fas fa-bolt
        interval: 25
        isTemp: false
        label: Voltage
        name: Voltage
        noDigits: '1'
        postCalc: null
        show: true
        showPopover: true
        showUnit: true
        type: gcIn
        unit: V
        updated: 1628968382280
        waitForPrint: false
        width: 0
      cu4:
        cmd: (?:B):.*? Current:([^ ]+)
        colorChangeLevel: 60
        colorIcons: false
        decSep: .
        graphSettings:
          color: '#000000'
          height: 50
          opa: 0.2
          show: false
          width: 1
        hideOnNoTarget: false
        icon: fas fa-battery-full
        interval: 25
        isTemp: false
        label: 'Current: '
        name: Current
        noDigits: '1'
        postCalc: null
        show: true
        showPopover: true
        showUnit: true
        type: gcIn
        unit: A
        updated: 1628968382280
        waitForPrint: false
        width: 0
    firstRun: false
    sortOrder:
    - bed
    - tool0
    - cu2
    - cu3
    - cu4
  classicwebcam:
    _config_version: 1
    snapshot: http://recore.local:8080/?action=snapshot
    stream: http://recore.local:8080/?action=stream
server:
  firstRun: true
  commands:
    serverRestartCommand: sudo systemctl restart octoprint.service
    systemRestartCommand: sudo reboot
    systemShutdownCommand: sudo shutdown -h now
webcam:
  ffmpeg: /usr/bin/avconv
serial:
    additionalPorts:
    - /tmp/printer
    port: /tmp/printer
    disconnectOnErrors: false
