# Prototype #126. Include from printer.cfg after provisioning, unless these
# sections already exist. OctoPrint and Moonraker share this upload directory.
[rebuild_firmware]

[virtual_sdcard]
path: /home/printer/printer_data/gcodes
on_error_gcode: TURN_OFF_HEATERS

[display_status]

[pause_resume]

# No printer-specific parking moves in this prototype's control macros.
[gcode_macro CANCEL_PRINT]
description: Cancel a Klipper virtual-SD print and turn off heaters
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
